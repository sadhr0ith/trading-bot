[project]
name = "trading-bot"
version = "0.1.0"
description = "Multi-strategy trading bot with ML-powered signals"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.3,<2",
    "scikeras>=0.13,<0.14",
    "xgboost>=1.7,<2",
    "tensorflow>=2.11,<3",
    "yfinance>=0.2,<1",
    "schedule>=1,<2",
    "python-binance>=1,<2",
    "pydantic>=1.10,<3",
    "email-validator>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4,<6",
    "black>=23,<25",
    "ruff>=0.1,<1",
    "mypy>=1.7,<2",
    "isort>=5.13,<6",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | saved_models
  | cache
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["venv/*", ".venv/*", "saved_models/*", "cache/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["trading-bot"]
exclude = ["venv", ".venv", "tests", "saved_models", "cache"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "binance.*", "scikeras.*", "tensorflow.*", "xgboost.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "venv", "build", "dist", "saved_models", "cache", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=trading-bot --cov-report=html --cov-report=term"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
